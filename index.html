<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@400;500&family=Roboto:wght@400;500&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet">

  <title>Personal Website</title>
  <link rel="stylesheet" href="./Assets/style.css">
</head>

<body>
  <!-- Hero Section Start-->
  <section class="hero-section">
    <div class="hero-content">
      <h1>Hi I'm Clar!<br>2nd year BSCS student<br></h1>
      <p>"Discover more about me. Let’s make something awesome together!"</p>
      <button class="explore-btn" onclick="window.location.href='#gallery-section';">Explore</button>
    </div>
    <div class="hero-images">
      <img src="./Assets/images/hero-images.png" alt="Showcasing creativity and energy">
    </div>
  </section>
  <!-- Hero Section End-->

  <!-- Circular Stats Section -->
  <section class="stats-section">
    <div class="stat">
      <h2>5+</h2>
      <p>Years of Creative Experience</p>
    </div>
    <div class="stat">
      <h2>500+</h2>
      <p>Satisfied Clients</p>
    </div>
    <div class="stat">
      <h2>1K+</h2>
      <p>Community Members</p>
    </div>
  </section>
  <!-- Circular Stats Section End -->

  <!-- Gallery Section -->
  <section id="gallery-section" class="last-container">
    <div class="pic-gallery">
      <div class="sight-1">
        <h2>Portfolio Highlights<br>---------</h2>
        <img src="./Assets/images/gallery1.png" alt="Portfolio Highlight 1">
      </div>
      <div class="sight-1">
        <img src="./Assets/images/gallery2.png" alt="Portfolio Highlight 2">
        <img src="./Assets/images/gallery3.png" alt="Portfolio Highlight 3">
      </div>
      <div class="sight-2">
        <img src="./Assets/images/gallery4.png" alt="Portfolio Highlight 4">
      </div>
      <div class="sight-1">
        <img src="./Assets/images/gallery5.png" alt="Portfolio Highlight 5">
        <img src="./Assets/images/gallery6.png" alt="Portfolio Highlight 6">
      </div>
      <div class="sight-1">
        <img src="./Assets/images/gallery7.png" alt="Portfolio Highlight 7">
        <h2>-------<br>Portfolio Highlights</h2>
      </div>
    </div>
  </section>
  <!-- Gallery Section End -->

</body>

</html>
